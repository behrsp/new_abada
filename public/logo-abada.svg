<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <!-- Clip path for the globe to contain grid lines and continents -->
    <clipPath id="globeClip">
      <ellipse cx="300" cy="175" rx="275" ry="155" />
    </clipPath>
  </defs>

  <!-- Black Background -->
  <rect width="600" height="350" fill="#000000" />

  <!-- Outer Globe Shell -->
  <ellipse cx="300" cy="175" rx="275" ry="155" fill="#000000" stroke="#DC2626" stroke-width="4" />

  <!-- Globe Content Group Clipped -->
  <g clip-path="url(#globeClip)">
    <!-- Globe Latitude Lines -->
    <ellipse cx="300" cy="175" rx="275" ry="120" fill="none" stroke="#B91C1C" stroke-width="1.5" opacity="0.8" />
    <ellipse cx="300" cy="175" rx="275" ry="85" fill="none" stroke="#B91C1C" stroke-width="1.5" opacity="0.8" />
    <ellipse cx="300" cy="175" rx="275" ry="45" fill="none" stroke="#B91C1C" stroke-width="1.5" opacity="0.8" />
    <line x1="25" y1="175" x2="575" y2="175" stroke="#B91C1C" stroke-width="2" opacity="0.9" />

    <!-- Globe Longitude Lines -->
    <line x1="300" y1="20" x2="300" y2="330" stroke="#B91C1C" stroke-width="2" opacity="0.9" />
    <ellipse cx="300" cy="175" rx="210" ry="155" fill="none" stroke="#B91C1C" stroke-width="1.5" opacity="0.8" />
    <ellipse cx="300" cy="175" rx="140" ry="155" fill="none" stroke="#B91C1C" stroke-width="1.5" opacity="0.8" />
    <ellipse cx="300" cy="175" rx="70" ry="155" fill="none" stroke="#B91C1C" stroke-width="1.5" opacity="0.8" />

    <!-- Continents Silhouettes in Red (#DC2626) -->
    <!-- North & South America -->
    <path d="M 120 70 Q 150 50 180 60 Q 210 80 190 110 Q 160 120 140 100 Z" fill="#DC2626" />
    <path d="M 190 120 Q 240 110 270 140 Q 290 180 260 230 Q 230 280 210 290 Q 200 250 210 200 Q 180 160 190 120 Z" fill="#DC2626" />
    <!-- Europe & Africa -->
    <path d="M 320 50 Q 360 40 380 70 Q 350 90 320 80 Z" fill="#DC2626" />
    <path d="M 310 100 Q 370 90 410 120 Q 420 170 390 220 Q 360 260 340 250 Q 320 210 330 160 Q 300 130 310 100 Z" fill="#DC2626" />
    <!-- Asia & Australia -->
    <path d="M 400 50 Q 480 40 520 80 Q 500 120 440 110 Q 410 90 400 50 Z" fill="#DC2626" />
    <path d="M 460 200 Q 520 190 530 230 Q 490 260 460 240 Z" fill="#DC2626" />
  </g>

  <!-- ABADÁ-CAPOEIRA Curved Ribbon Banner -->
  <!-- Outer Banner Background with Red Fill -->
  <path d="M 15 175 Q 300 120 585 175 Q 300 230 15 175 Z" fill="#DC2626" stroke="#B91C1C" stroke-width="3" />
  <!-- Inner Ribbon Line Borders -->
  <path d="M 25 175 Q 300 130 575 175" fill="none" stroke="#991B1B" stroke-width="2" />
  <path d="M 25 175 Q 300 220 575 175" fill="none" stroke="#991B1B" stroke-width="2" />

  <!-- ABADÁ-CAPOEIRA Text inside Ribbon -->
  <text x="300" y="187" text-anchor="middle" fill="#000000" font-family="'Times New Roman', 'Playfair Display', Georgia, serif" font-weight="900" font-size="38" letter-spacing="3">
    ABADÁ-CAPOEIRA
  </text>
</svg>
